%test.quarkus.http.test-port=0
%test.quarkus.management.test-port=0
variability.fixture.directory=../../../examples/food-service/mvp-v1
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
%prod.quarkus.datasource.username=${PGUSER}
%prod.quarkus.datasource.password=${PGPASSWORD}
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
energy.odip.origin=https://web-odip.apps.eseidinger.de
energy.odip.local-fixture=${ENERGY_ODIP_LOCAL_FIXTURE:false}
energy.ai.enabled=${ENERGY_AI_ENABLED:false}
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:disabled}
quarkus.langchain4j.openai.chat-model.model-name=${ENERGY_AI_MODEL:gpt-6.1-sol}
quarkus.langchain4j.openai.chat-model.response-format=json_object
quarkus.langchain4j.openai.timeout=${ENERGY_AI_TIMEOUT:180s}
quarkus.langchain4j.openai.enable-integration=${ENERGY_AI_ENABLED:false}
quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false
quarkus.management.enabled=true
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:0.1}
quarkus.otel.sdk.disabled=false
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
