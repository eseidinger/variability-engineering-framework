name: Build, test, and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/variability-engineering-framework

jobs:
  docs:
    name: Documentation and manifest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-docs.mjs
      - run: jq empty application.json application-test.json

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prototype/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/prototype/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  energy-contract:
    name: Pinned energy contract kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.17'
      - uses: actions/cache@v4
        with:
          path: .cache/energy-contract-kit
          key: energy-contract-${{ runner.os }}-${{ hashFiles('contracts/energy/contract-kit.lock.json') }}
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/validate-energy-contract-kit.py

  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prototype/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/energy-contract-kit
          key: energy-contract-${{ runner.os }}-${{ hashFiles('contracts/energy/contract-kit.lock.json') }}
      - name: Prepare shared fixtures for Java consumer tests
        working-directory: .
        run: |
          python3 scripts/validate-energy-contract-kit.py --prepare-only --output-dir "$RUNNER_TEMP/energy-contract-kit"
          kit_version=$(jq -r .version contracts/energy/contract-kit.lock.json)
          echo "ENERGY_CONTRACT_KIT_DIRECTORY=$RUNNER_TEMP/energy-contract-kit/contract-kit-v$kit_version/contract-kit" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress test

  integration:
    name: Packaged integration verification
    needs: [ui, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: apps/prototype/integration-tests/verify-compose.sh

  publish:
    name: Publish Docker image
    needs: [docs, ui, api, integration, energy-contract]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/prototype/deployment/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  deploy:
    name: Deploy release to vareng
    needs: publish
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vareng-production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install developer-platform-cli==0.3.0
      - name: Deploy versioned image
        run: |
          python3 scripts/render-application.py --tag "$GITHUB_REF_NAME" > deployment-application.json
          devplat deploy apply --project vareng --file deployment-application.json --wait --output json
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          PLATFORM_TOKEN_ENDPOINT: ${{ vars.PLATFORM_TOKEN_ENDPOINT }}
          PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          PLATFORM_CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET }}
      - name: Verify protected public entry point
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 12 --retry-all-errors --retry-delay 5 \
            https://web-vareng.apps.eseidinger.de/api/status)
          case "$status" in
            302|403) echo "Public route is protected (HTTP $status)." ;;
            *) echo "Expected protected public route, got HTTP $status." >&2; exit 1 ;;
          esac

  deploy-test:
    name: Deploy latest to vareng-test
    needs: publish
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: vareng-test-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install developer-platform-cli==0.3.0
      - name: Deploy latest image
        run: |
          devplat deploy apply --project vareng-test --file application-test.json --wait --output json
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          PLATFORM_TOKEN_ENDPOINT: ${{ vars.PLATFORM_TOKEN_ENDPOINT }}
          PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID_TEST }}
          PLATFORM_CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET_TEST }}
      - name: Verify protected public entry point
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 12 --retry-all-errors --retry-delay 5 \
            https://web-vareng-test.apps.eseidinger.de/api/status)
          case "$status" in
            302|403) echo "Public route is protected (HTTP $status)." ;;
            *) echo "Expected protected public route, got HTTP $status." >&2; exit 1 ;;
          esac
