name: variability-engineering

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: variability
      POSTGRES_USER: variability
      POSTGRES_PASSWORD: variability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U variability -d variability"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/prototype/deployment/Dockerfile
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/variability
      QUARKUS_DATASOURCE_USERNAME: variability
      QUARKUS_DATASOURCE_PASSWORD: variability
      QUARKUS_OTEL_SDK_DISABLED: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
